_min_copier_version: "9.4.0"

_templates_suffix: ""
_preserve_symlinks: true

_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[[="
  variable_end_string: "=]]"
  comment_start_string: "<#"
  comment_end_string: "#>"
  line_statement_prefix: "# %"
  keep_trailing_newline: true

_exclude:
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - docs/addons.md
  - "<% if not bcrypt_pool %>auth/services/password_hasher.py<% endif %>"
  - "<% if not bcrypt_pool %>tests/test_password_hasher.py<% endif %>"
  - "<% if not redis_blocklist %>auth/redis_blocklist.py<% endif %>"
  - "<% if not redis_blocklist %>tests/test_redis_blocklist.py<% endif %>"
  - "<% if not outbox %>core/outbox<% endif %>"
  - "<% if not outbox %>core/dead_letter<% endif %>"
  - "<% if not outbox %>tests/test_outbox*.py<% endif %>"
  - "<% if not outbox %>tests/test_dead_letter.py<% endif %>"
  - "<% if not read_replica %>core/replica<% endif %>"
  - "<% if not read_replica %>tests/test_replica*.py<% endif %>"

_tasks:
  - uv run --frozen ruff check --fix --select I --quiet .
  - uv run --frozen ruff format --quiet .
  - |
    uv run --frozen python - <<'EOF'
    from pathlib import Path

    from detect_secrets import SecretsCollection
    from detect_secrets.core import baseline

    path = ".secrets.baseline"
    template_baseline = baseline.load_from_file(path)
    recorded = baseline.load(template_baseline, path)
    for removed_file in [name for name in recorded.files if not Path(name).exists()]:
        del recorded.data[removed_file]
    kept_files = sorted(recorded.files)
    rescanned = SecretsCollection()
    for name in kept_files:
        rescanned.scan_file(name)
    recorded.trim(scanned_results=rescanned, filelist=kept_files)
    refreshed = baseline.format_for_output(recorded)
    refreshed["generated_at"] = template_baseline["generated_at"]
    baseline.save_to_file(refreshed, path)
    EOF

bcrypt_pool:
  type: bool
  default: false
  help: >-
    Bounded thread pool for bcrypt. Past the limit, password operations get a 503
    with Retry-After instead of queueing. Without it, hashing uses asyncio.to_thread.

redis_blocklist:
  type: bool
  default: false
  help: >-
    Cache revoked token ids in Redis, so an authenticated request checks Redis instead
    of the database. Without it, every request reads the revoked_tokens table.

outbox:
  type: bool
  default: false
  help: >-
    Transactional outbox plus a dead-letter queue. Background jobs are written to an
    outbox table in the same transaction as the business write, a relay in the worker
    enqueues them, and jobs that exhaust their retries land in a dead-letter table with
    an admin API. Without it, jobs are enqueued right after the write commits.

read_replica:
  type: bool
  default: false
  help: >-
    Route plain reads to a Postgres read replica (DATABASE_REPLICA_URL), keep a request
    on the primary once it writes, and fail reads over to the primary when the replica
    is down. Adds the postgres-replica container. Without it, everything uses one engine.
