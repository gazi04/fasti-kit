global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  # Each dockerized `app` replica as its own instance (load test, see docs/load-testing.md).
  - job_name: 'app_replicas'
    scrape_interval: 5s
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 8000
