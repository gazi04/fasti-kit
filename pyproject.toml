[project]
name = "fasti-kit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.138.2",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.49.0",
    "asyncpg>=0.31.0",
    "uvloop>=0.22.1",
    "httptools>=0.8.0",
    "pyjwt>=2.13.0",
    "authx>=1.7.1",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.10",
    "fastapi-mail[aioredis,httpx]>=1.6.5",
]

[project.scripts]
create-domain = "scripts.create_domain:main"
create-entity = "scripts.create_entity:main"
create-model = "scripts.create_model:main"
create-repository = "scripts.create_repository:main"
create-service = "scripts.create_service:main"
create-schema = "scripts.create_schema:main"
create-route = "scripts.create_route:main"
create-all = "scripts.create_all:main"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "pip-audit>=2.10.1",
    "py-spy>=0.4.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["core*", "user*", "scripts*"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the intended pattern
    "S101",  # assert — allowed, see per-file-ignores for tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**"    = ["S101", "S105", "S106"]   # asserts + hardcoded test passwords
"scripts/**"  = ["E501"]                   # scaffolding templates are long strings
"alembic/**"  = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["auth", "user", "core", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"                    # no @pytest.mark.asyncio on every test
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["auth", "user", "core"]
omit = ["*/alembic/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "alembic"]

[tool.deptry]
known_first_party = ["auth", "user", "core", "scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg2-binary", "uvloop", "httptools"]  # used by drivers/uvicorn, not imported
