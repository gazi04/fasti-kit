name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fasti_kit
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      MAIL_FROM: ci@example.com
      MAIL_PORT: "1025"
      MAIL_SERVER: localhost
      MAIL_STARTTLS: "False"
      MAIL_SSL_TLS: "False"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fasti_kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: uv sync --all-groups

      - name: pre-commit
        if: ${{ !cancelled() }}
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: import-linter
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      - name: pip-audit
        if: ${{ !cancelled() }}
        run: uv run pip-audit

      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run deptry .

      - name: Prepare test databases
        if: ${{ !cancelled() }}
        # tests/isolation_plugin.py points the whole test run at `fasti_kit_test`,
        # whose schema the fixtures create. The migrations still run against
        # `fasti_kit` to check that they apply cleanly from an empty database.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fasti_kit_test;"
          uv run alembic upgrade head

      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run pytest --cov

      - name: scaffolding smoke test
        if: ${{ !cancelled() }}
        run: ./scripts/smoke_scaffold.sh
